# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  postgres:
    image: postgres:16
    container_name: crablearn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crablearn}
      POSTGRES_USER: ${POSTGRES_USER:-crablearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crablearn123}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crablearn} -d ${POSTGRES_DB:-crablearn}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: crablearn-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-crablearn}
      PGPASSWORD: ${POSTGRES_PASSWORD:-crablearn123}
      PGDATABASE: ${POSTGRES_DB:-crablearn}
    ports:
      - "${APP_PORT:-80}:4000"

volumes:
  postgres_data:
