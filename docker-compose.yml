services:
  db:
    image: postgres:16
    container_name: crablearn-postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crablearn}
      POSTGRES_USER: ${POSTGRES_USER:-crablearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crablearn123}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crablearn} -d ${POSTGRES_DB:-crablearn}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crablearn-app
    working_dir: /app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      PORT: 4000
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-crablearn}
      PGPASSWORD: ${POSTGRES_PASSWORD:-crablearn123}
      PGDATABASE: ${POSTGRES_DB:-crablearn}
      VITE_API_BASE_URL: http://localhost:4000
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "${APP_PORT:-5173}:5173"
      - "4000:4000"
    command: sh -c "npm install && npm run dev:full"

volumes:
  postgres_data:
